name: unpack_lab
description: Benign PE unpacking lab stages with x64dbg, OEP evidence and independent verification
category: reverse
danger: intrusive
timeout: 90
requires: []
keywords: [unpack, OEP, EP, dump, workflow, lab]
search_text: Only registered self-built corpus samples. Call inspect, plan, ep, breakpoint, oep, validate, dump, verify in order. Plain control uses passthrough after plan. release stops only this run's debugger. Does not read evaluator OEP ground truth.
example: {action: inspect, sample: sample_05}
schema:
  type: object
  additionalProperties: false
  properties:
    action:
      type: string
      enum: [inspect, plan, ep, breakpoint, oep, validate, dump, passthrough, verify, report, release]
    sample: {type: string, pattern: '^sample_[0-9]{2}$'}
    run_id: {type: string, pattern: '^[a-f0-9]{16}$'}
    plan: {type: string}
    report: {type: string}
  required: [action]
