name: recon_state
description: 攻击面三轴状态与任务报告台账
category: agent
danger: intrusive
timeout: 30
requires: []
origin: builtin
keywords: [攻击面, 状态机, 状态, 进度, 差集, 补测, 复核, 汇总, 报告, recon, surface, aggregate, backlog]
op_danger:
  init: intrusive
  # Live job status changes outside this tool. Follow the existing dynamic-tool
  # convention: unknown prevents the agent loop from caching a successful read.
  status: unknown
  list: readonly
  upsert: intrusive
  claim: intrusive
  bind: intrusive
  release: intrusive
  report: intrusive
  review: intrusive
  mark: intrusive
  chain: intrusive
  advance: intrusive
  new_round: intrusive
  export: intrusive
search_text: |
  主智能体管理攻击面台账，调用 {op,params}。相对路径在当前会话 files；不探测、不自动派发、不写 wpbox、不控制权限/停止。子代理仍用原 subagent，结束/取消仍用原机制。
  init(target,scope?): 初始化本会话；同目标幂等，不覆盖旧台账。scope 仅记录背景。
  status(checkpoint?): 查询阶段、三轴统计、差集/补测/复核队列、已绑定子代理的真实 job_status、下一步。收到新通知后checkpoint填实际通知/agent_id或台账版本，区分有新事件的查询，兼容同轮重复调用保护；禁止随机改参数循环轮询。台账状态只在工具调用时更新，不随后台自动改变。
  upsert(items或path): 登记入口数组，集中生成稳定 ID。每项至少 entry(如https://api.example.com/swagger)、type。type=web/api/api-doc/admin/file/cloud/middleware/container/remote/dns/js；可附 family、ip/cname/asn/tech/auth_state/exposure/evidence/priority/next_direction。非HTTP例 mqtt://host:1883/。不手写ID；三轴由台账维护。大输入写JSON文件后传path。
  list(surface_ids?/delta_state?/task_state?/confirm_state?/family?/priority?,offset?,limit?): 分页条目，默认50最多500。
  claim(queue=new|retry,limit=6,family?,max_attempts=3): 同族领取最多6条，返回 E<N>、surface_items、独立报告路径、子角色指令。new仅NEW/CHANGED且PENDING；retry收TIMEOUT/INCOMPLETE，即使UNCHANGED。领取避免重复分配；不调用子代理。自行subagent派发后bind，派发失败release。family=web_api/management/files/cloud/middleware/container/remote/dns/js。
  bind(task_id,batch_id,agent_id): 记录subagent回执，业务任务置RUNNING；提交成功不等于完成。
  release(task_id,reason,task_state=BLOCKED): 释放未交报告任务，状态可PENDING/BLOCKED/TIMEOUT/SKIPPED；不取消真正的子代理。需要取消仍使用原机制。迟到旧任务不能覆盖更新任务。
  report(task_id,data或path): 导入独立JSON，必含 task_id,surfaces,findings,negatives,next_directions,blocked_by,timeout(bool)。每条surface引用分配的surface_id，含confirm_state、task_state(默认DONE)；CONFIRMED/NEGATIVE必须有evidence对象。可附auth_state/priority等。缺条目进补测；timeout但报告覆盖完整则采纳。报告幂等，已提交报告不能改写，补测新建任务。新发现另upsert。findings引用surface_id，含title/severity，先保存为候选，不直接当漏洞。
  review(surface_ids,evidence,replay_call_id,note,confirm_state=CONFIRMED,finding_ids?): 主代理重放后记录独立调用ID、证据和结论；相同响应可去重，但保留复核来源。P0/P1与冲突项必须复核。此卡校验记录完整性，不验证模型是否真的执行重放。
  mark(surface_ids,note,delta_state?/task_state?/confirm_state?): 人工维护一个或多个轴。delta仅STALE/INVALID；task仅PENDING/BLOCKED/TIMEOUT/SKIPPED；confirm仅CANDIDATE/NEEDS_AUTH/INCOMPLETE。确认结论走report/review。
  chain(data或path): 仅存攻击链假设；entry_id/next_entry_id/evidence_id引用已有记录，另需precondition/verify_action/impact/confidence/authorization_required/status；集中生成chain_id，不执行动作。
  advance(phase,note?): ENUMERATE→CLUSTER→DISPATCH→WAIT→REVIEW→COMMIT→SUMMARIZE→COMPLETE。DISPATCH可直接REVIEW，REVIEW可回DISPATCH补测。只推进台账；仍在途或待复核不能收口。COMPLETE前export，有未完项需note标注部分完成。
  new_round(stale_ids?): 开新轮，保留ID、基线和未完项；未观测对象不自动标旧。明确失效才提供stale_ids。
  export(): 同源生成AGGREGATE.json/.md、独立E<N>.json/.md，保留负结论/待办/候选/复核来源。JSON为事实源，MD为视图。入库仍由主代理调用wpbox，三轴放attrs，禁止替换wpbox.status枚举。
example:
  op: status
schema:
  type: object
  additionalProperties: false
  required: [op]
  properties:
    op:
      type: string
      enum: [init, status, list, upsert, claim, bind, release, report, review, mark, chain, advance, new_round, export]
    params:
      type: object
      additionalProperties: false
      properties:
        target: {type: string, minLength: 1}
        checkpoint: {type: string, minLength: 1, description: status查询的实际通知ID或台账版本，只区分查询上下文，不修改状态}
        scope: {type: object}
        items: {type: array, minItems: 1, items: {type: object}}
        path: {type: string, minLength: 1, description: 会话files内JSON路径；upsert读数组，report/chain读对象}
        data: {type: object}
        surface_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        stale_ids: {type: array, uniqueItems: true, items: {type: string}}
        finding_ids: {type: array, uniqueItems: true, items: {type: string}}
        delta_state: {type: string, enum: [NEW, CHANGED, UNCHANGED, STALE, INVALID]}
        task_state: {type: string, enum: [PENDING, RUNNING, DONE, BLOCKED, TIMEOUT, SKIPPED]}
        confirm_state: {type: string, enum: [CONFIRMED, NEGATIVE, CANDIDATE, NEEDS_AUTH, INCOMPLETE]}
        family: {type: string, enum: [web_api, management, files, cloud, middleware, container, remote, dns, js]}
        priority: {type: string, enum: [P0, P1, P2, P3]}
        queue: {type: string, enum: [new, retry]}
        max_attempts: {type: integer, minimum: 1, maximum: 20}
        limit: {type: integer, minimum: 1, maximum: 500}
        offset: {type: integer, minimum: 0}
        task_id: {type: string, pattern: '^E[1-9][0-9]*$'}
        batch_id: {type: string, minLength: 1}
        agent_id: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        note: {type: string, minLength: 1}
        evidence: {type: object, minProperties: 1}
        reviewer: {type: string, minLength: 1}
        replay_call_id: {type: string, minLength: 1}
        phase: {type: string, enum: [ENUMERATE, CLUSTER, DISPATCH, WAIT, REVIEW, COMMIT, SUMMARIZE, COMPLETE]}
  allOf:
    - if:
        properties:
          op: {const: claim}
      then:
        properties:
          params:
            properties:
              limit: {maximum: 6}
