name: fenjing
description: SSTI 模板注入(Jinja2/Flask)检测与利用
category: web
danger: unknown    # 混合：gen_payload 本地生成只读；scan/crack 发攻击流量（见 op_danger）
timeout: 600
requires: []                    # venv console script（gateway venv pip install fenjing）
keywords: [fenjing, ssti, 模板注入, template, jinja2, jinja, flask, render_template_string, 注入, rce, waf绕过, ctf]
search_text: >
  检测并利用 SSTI 模板注入（Jinja2/Flask）：scan 整站扫注入点、crack 指定表单参数
  利用并在目标上执行命令（自动探测并绕过 WAF）、gen_payload 按被 WAF 的关键字本地
  生成绕过 payload（不发网络）。页面输出点回显 {{7*7}} 变 49 即典型信号。
example: {op: "scan", url: "http://target/page?name=test"}
schema:
  type: object
  properties:
    op:
      type: string
      enum: [scan, crack, gen_payload]
      description: scan=整站扫注入点 / crack=攻击指定参数拿 RCE / gen_payload=本地生成绕 WAF payload(不发网)
    url:
      type: string
      description: 目标 URL，以 http(s):// 开头（scan/crack 必填）
    inputs:
      type: string
      description: 'crack 必填：注入参数名，逗号分隔，如 "name" 或 "username,password"'
    exec_cmd:
      type: string
      description: 成功后在目标执行的命令（crack 必填；scan 默认 "echo 1" 用于确认；避免进入交互模式）
    method:
      type: string
      enum: [GET, POST, PUT]
      description: 参数提交方式，crack 默认 POST
    action:
      type: string
      description: 表单提交路径，与 URL 路径不同时填
    keywords:
      type: string
      description: gen_payload 必填：被 WAF 拦的关键字，逗号或换行分隔，如 "class,import,eval"
    command:
      type: string
      description: gen_payload 必填：payload 要执行的命令
    cookies:
      type: string
      description: 请求 Cookie，如 "PHPSESSID=abc"
    user_agent:
      type: string
      description: 自定义 UA
    extra_params:
      type: string
      description: 额外 GET 参数，如 "a=1&b=2"
    extra_data:
      type: string
      description: 额外 POST 参数，如 "a=1&b=2"
    detect_mode:
      type: string
      enum: [fast, accurate]
      description: 分析模式，默认 accurate（fast 省时但漏报多）
    environment:
      type: string
      enum: [jinja2, flask]
      description: 模板执行环境，默认 jinja2（目标是 Flask 的 render_template_string 选 flask）
    find_flag:
      type: boolean
      description: 自动在目标文件系统里找 flag
    no_verify_ssl:
      type: boolean
      description: 不验证 SSL 证书
    proxy:
      type: string
      description: '代理，如 "http://127.0.0.1:8080"'
  required: [op]
op_danger:
  gen_payload: readonly
  scan: intrusive
  crack: intrusive
